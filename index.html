<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galaxy Store</title>
<style>
:root{--bg:#fff;--tx:#202124;--mu:#5f6368;--sf:#f1f3f4;--bd:#dadce0;--gr:#01875f;--grd:#016e4e;--bl:#1a73e8;--yl:#f9ab00;--rd:#d93025;--card:#fff;--ov:rgba(32,33,36,.6)}
@media(prefers-color-scheme:dark){:root{--bg:#131314;--tx:#e3e3e3;--mu:#9aa0a6;--sf:#1e1f20;--bd:#3c4043;--gr:#00a173;--grd:#058e68;--bl:#8ab4f8;--card:#1e1f20}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gr);box-shadow:0 0 0 1px var(--gr)}
svg{fill:currentColor;flex:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
#main{flex:1;padding-bottom:84px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--sf);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20;border-top:1px solid var(--bd)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);min-width:64px;font-weight:500}
#nav a .pl{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
#nav a.on{color:var(--tx)}
#nav a.on .pl{background:rgba(1,135,95,.18);color:var(--gr)}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.pill{flex:1;height:48px;border-radius:24px;background:var(--sf);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--mu);cursor:text}
.avs{width:36px;height:36px;border-radius:50%;background:var(--gr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.lg{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;display:block}
.tabs{display:flex;gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{padding:12px 14px;font-weight:500;color:var(--mu);white-space:nowrap;position:relative}
.tabs .on{color:var(--gr)}
.tabs .on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gr)}
.dbar{display:flex;align-items:center;gap:6px;padding:8px 8px;min-height:56px}
.dbar .t{flex:1;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.ib:active{background:var(--sf)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 8px}
.sec h2{margin:0;font-size:20px;font-weight:500}
.sec a,.sec button{color:var(--gr);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tile{flex:0 0 108px;scroll-snap-align:start;display:block}
.ic{border-radius:22%;object-fit:cover;display:block;background:var(--sf)}
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:28px}
.tn{margin-top:8px;font-size:14px;line-height:1.25;max-height:36px;overflow:hidden}
.ts{margin-top:2px;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ban{flex:0 0 88%;max-width:420px;scroll-snap-align:center;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#222;color:#fff;display:block}
.ban .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ban .sh{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.78))}
.ban .bi{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:10px;align-items:center}
.ban .bi b{display:block;font-size:16px}
.ban .bi small{opacity:.85}
.rw{display:flex;gap:14px;align-items:center;padding:10px 16px}
.rw .rk{width:18px;text-align:center;color:var(--mu);font-size:13px}
.rw .fx{flex:1;min-width:0}
.rw .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .sub{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);border-radius:8px;padding:8px 14px;white-space:nowrap;color:var(--tx);background:var(--bg)}
.chip.on{background:rgba(1,135,95,.15);border-color:transparent;color:var(--gr);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:0 22px;height:40px;background:var(--gr);color:#fff;font-weight:500;white-space:nowrap}
.btn:active{background:var(--grd)}
.btn.out{background:transparent;color:var(--gr);border:1px solid var(--bd)}
.btn.sm{height:32px;padding:0 16px;font-size:13px}
.btn.red{background:var(--rd)}
.btn.blk{width:100%;height:48px;border-radius:24px;font-size:15px}
.btn[disabled]{opacity:.55;pointer-events:none}
.pad{padding:16px}
.mu{color:var(--mu)}
.cardx{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 16px}
.hero{display:flex;gap:16px;padding:8px 16px 0}
.hero .nm{font-size:24px;font-weight:500;line-height:1.2}
.hero .dv{color:var(--gr);font-weight:500;margin-top:6px}
.hero .cf{color:var(--mu);font-size:12px;margin-top:4px}
.stats{display:flex;align-items:center;padding:18px 8px 6px;text-align:center}
.stats>div{flex:1;border-right:1px solid var(--bd);padding:0 6px}
.stats>div:last-child{border:0}
.stats b{display:flex;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500}
.stats small{color:var(--mu);font-size:12px}
.age{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--mu);border-radius:3px;padding:0 4px;font-size:11px}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shots img{height:260px;border-radius:12px;display:block;background:var(--sf);flex:none}
.big{font-size:56px;font-weight:300;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--sf);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--gr)}
.stars{display:inline-flex;gap:1px;color:var(--gr)}
.stars svg{width:14px;height:14px}
.rv{padding:12px 16px}
.rv .hd{display:flex;gap:12px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--bd)}
.kv span:first-child{color:var(--mu)}
.kv span:last-child{text-align:right;word-break:break-word}
.tg{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;background:var(--sf)}
.tg.y{background:#fef7e0;color:#b06000}.tg.g{background:#e6f4ea;color:#137333}.tg.r{background:#fce8e6;color:#c5221f}
@media(prefers-color-scheme:dark){.tg.y{background:#3a2f0b;color:#fdd663}.tg.g{background:#0f2a1b;color:#81c995}.tg.r{background:#3c1613;color:#f28b82}}
.empty{padding:48px 24px;text-align:center;color:var(--mu)}
.lbl{font-size:13px;color:var(--mu);margin:16px 0 6px}
.fld{margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;z-index:100;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:var(--ov)}
#sheet .sh{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet .sh h3{margin:0 0 12px;font-size:20px;font-weight:500}
#splash{position:fixed;inset:0;z-index:200;background:#fff;color:#202124;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img.lo{width:184px;height:184px;border-radius:50%;box-shadow:0 8px 30px rgba(40,50,120,.25);animation:pop .8s ease both}
#splash h1{margin:30px 16px 0;font-size:23px;white-space:nowrap;font-weight:600;text-align:center;animation:up .8s .25s ease both}
#splash .pw{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;color:#5f6368;font-size:13px;animation:up .8s .5s ease both}
#splash .pw span{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:2px;color:#202124;font-size:15px}
#splash .pw img{width:26px;height:26px;border-radius:50%}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.authw{padding:24px 24px 40px}
.authw .lo{width:84px;height:84px;border-radius:50%;display:block;margin:8px auto 12px}
.authw h1{text-align:center;font-size:24px;font-weight:500;margin:0 0 4px}
.upl{border:1px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--mu);cursor:pointer;display:block}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.thumbs div{position:relative;flex:none}
.thumbs img{height:96px;border-radius:8px;display:block}
.thumbs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;line-height:22px}
.prog{height:6px;border-radius:3px;background:var(--sf);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--gr);transition:width .2s}
</style>
</head>

 tick(0,'Uploading icon…');const iconUrl=await uploadFile(F.icon,base+'icon.png','image/png',f=>tick(f,'Uploading icon…'));done++;const shots=[];for(let i=0;i<F.shots.length;i++){tick(0,'Uploading screenshot '+(i+1)+'…');shots.push(await uploadFile(F.shots[i],base+'s'+i+'.jpg','image/jpeg',f=>tick(f,'Uploading screenshot '+(i+1)+'…')));done++}
 let apk='',size=0;if(F.apk){tick(0,'Uploading app file…');apk=await uploadFile(F.apk,base+'app.apk','application/vnd.android.package-archive',f=>tick(f,'Uploading app file… '+Math.round(f*100)+'%'));size=F.apk.size;done++}
 bar.style.width='100%';pt.textContent='Uploaded';const isWeb=!F.apk&&d.url&&!/\.apk(\?|$)/i.test(d.url)&&d.type!=='apkonly';
 return{id:'gsa_'+id,dev:S.me.id,devName:d.devName,name:d.name,type:d.type,cat:d.cat,pkg:d.pkg,short:d.short,desc:d.desc,whatsnew:d.whatsnew,ver:d.ver,age:d.age,country:d.country,email:d.email,site:d.site,icon:iconUrl,shots,apk,apkUrl:F.apk?'':(isWeb?'':d.url),web:isWeb?d.url:'',size,ts:Date.now()}}
async function submitApp(){const r=readForm();if(r.err)return toast(r.err);const b=$('[data-act=submitapp]');b.disabled=true;let app;try{app=await uploadAll(r.d)}catch(e){b.disabled=false;$('#f_pg').style.display='none';return toast('Upload failed: '+String(e.message).slice(0,100)+'. Files over 48 MB need a link.')}

async function usdRate(){try{const r=await fetch('https://open.er-api.com/v6/latest/USD'),j=await r.json();const v=j&&j.rates&&j.rates.NGN;if(v>100)return v}catch(e){}return S.cfg.rate||1500}
async function payFlow(app){const rate=await usdRate(),ngn=Math.ceil(S.cfg.fee*rate/10)*10;openSheet(`<h3>Publishing fee</h3><div style="font-size:34px;font-weight:500">$${Number(S.cfg.fee).toFixed(2)}</div><div class="mu">Charged as ₦${ngn.toLocaleString()} by card (Visa, Mastercard, Verve) through Paystack. One-time fee for “${esc(app.name)}”.</div><div class="cardx" style="margin:16px 0"><b>What happens next</b><div class="mu" style="margin-top:6px">1. You pay by card.<br>2. Your app goes into review.<br>3. We decide within <b>2 working days</b> (by ${fmtDate(addWorkDays(Date.now(),2),{weekday:'long',day:'numeric',month:'long'})}).<br>4. Approved apps appear in the store.</div></div><button class="btn blk" id="payb">Pay $${Number(S.cfg.fee).toFixed(2)} by card</button><button class="btn out blk" style="margin-top:10px" data-act="closesheet">Cancel</button>`);
 $('#payb').onclick=async()=>{try{await loadPaystack()}catch(e){return toast('Could not open the card page. Check your internet.')}const ref='GS'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();try{PaystackPop.setup({key:PK,email:S.me.email,amount:ngn*100,currency:'NGN',ref,metadata:{store:'galaxy',app:app.id,uid:S.me.id,usd:S.cfg.fee},callback:function(r){paid(app,(r&&r.reference)||ref,ngn)},onClose:function(){}}).openIframe()}catch(e){toast('Could not start the payment')}}}
let _ps=false;function loadPaystack(){return new Promise((res,rej)=>{if(window.PaystackPop)return res();if(_ps)return setTimeout(()=>window.PaystackPop?res():rej(),1500);_ps=true;const s=document.createElement('script');s.src='https://js.paystack.co/v1/inline.js';s.onload=()=>res();s.onerror=()=>{_ps=false;rej()};document.head.appendChild(s)})}
async function paid(app,ref,ngn){app.status='review';app.paid=true;app.ref=ref;app.ngn=ngn;app.submitted=Date.now();app.due=addWorkDays(app.submitted,2);try{await put(app.id,'gs_app',app.dev,app);S.apps.unshift(app);closeSheet();F.icon=null;F.shots=[];F.apk=null;F._fresh=true;openSheet(`<div style="text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:#e6f4ea;color:#137333;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${ic('check',36)}</div><h3>Payment received</h3><div class="mu">“${esc(app.name)}” is now in review. We will decide by <b>${fmtDate(app.due,{weekday:'long',day:'numeric',month:'long'})}</b>. Payment reference: ${esc(ref)}</div><a class="btn blk" href="#/dev" style="margin-top:18px" data-act="closesheet">View my apps</a></div>`)}catch(e){toast('Payment received ('+ref+') but saving failed. Please contact veltexglobal@gmail.com with this reference.')}}
/* ---------- admin ---------- */
async function vAdmin(tab){$('#top').innerHTML=detailBar('Admin console');setNav('me');if(!S.admin)return`<div class="empty">Admins only.</div>`;tab=tab||'review';
 const tabs=[['review','Review'],['all','All apps'],['users','Users'],['cfg','Settings']],bar=`<div class="tabs">${tabs.map(t=>`<a href="#/admin/${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}${t[0]==='review'&&S.apps.some(a=>a.status==='review')?` (${S.apps.filter(a=>a.status==='review').length})`:''}</a>`).join('')}<a href="#/dev/new">Upload free</a></div>`;
 if(tab==='review'){const L=S.apps.filter(a=>a.status==='review').sort((a,b)=>(a.due||0)-(b.due||0));return bar+(L.length?L.map(a=>`<div class="cardx"><div class="rw" style="padding:0">${icon(a,56)}<div class="fx"><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.devName)} · ${esc(a.cat)} · v${esc(a.ver)}</div><div class="sub">Paid ${a.ref?esc(a.ref):''} · due ${fmtDate(a.due||Date.now(),{weekday:'short',day:'numeric',month:'short'})}</div></div></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn out sm" href="#/app/${a.id}">Open</a>${a.apk||a.apkUrl?`<a class="btn out sm" href="${esc(a.apk||a.apkUrl)}">Download file</a>`:''}<button class="btn sm" data-act="approve" data-id="${a.id}">Approve</button><button class="btn red sm" data-act="reject" data-id="${a.id}">Reject</button></div></div>`).join(''):`<div class="empty">No apps waiting for review.</div>`)}
 if(tab==='all'){const L=S.apps.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));return bar+(L.length?L.map(a=>`<div class="rw"><a href="#/app/${a.id}" style="display:flex;gap:14px;align-items:center;flex:1;min-width:0">${icon(a,48)}<div class="fx"><div class="nm">${esc(a.name)}</div><div class="sub">${statusTag(a)} · ${esc(a.devName||'')}${installs(a)?' · '+installs(a)+' installs':''}</div></div></a><button class="btn out sm" data-act="${a.featured?'unfeat':'feat'}" data-id="${a.id}">${a.featured?'Unfeature':'Feature'}</button>${a.status==='live'?`<button class="btn out sm" data-act="unpub" data-id="${a.id}">Unpublish</button>`:`<button class="btn sm" data-act="approve" data-id="${a.id}">Publish</button>`}<button class="ib" data-act="deleteapp" data-id="${a.id}">${ic('trash')}</button></div>`).join(''):`<div class="empty">No apps yet.</div>`)}
 if(tab==='users'){let us=[];try{us=(await q('kind=eq.gs_user&select=data&limit=1000&order=updated_at.desc')).map(x=>x.data)}catch(e){}return bar+`<div class="pad mu">${us.length} account${us.length===1?'':'s'}</div>`+us.map(u=>`<div class="rw"><div class="avs" style="background:${colorOf(u.name)}">${esc((u.name||'?')[0].toUpperCase())}</div><div class="fx"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.email||'')} · ${esc(u.phone||'')}</div></div><div class="sub">${fmtDate(u.ts||Date.now())}</div></div>`).join('')}
 return bar+`<div class="pad"><div class="lbl">Publishing fee (US dollars)</div><input id="c_fee" type="number" min="1" step="1" value="${S.cfg.fee}"><div class="lbl">Backup exchange rate (naira per dollar). The live rate is used first.</div><input id="c_rate" type="number" min="100" value="${S.cfg.rate}"><button class="btn blk" style="margin-top:18px" data-act="savecfg">Save settings</button></div>`}
async function setApp(id,patch){const a=byId(id);if(!a)return;Object.assign(a,patch);await put(a.id,'gs_app',a.dev,a);render()}
/* ---------- actions ---------- */
function recordInstall(a){const L=store.get('gs_lib',[]);if(!L.some(x=>x.id===a.id)){L.push({id:a.id,name:a.name,icon:a.icon,ts:Date.now()});store.set('gs_lib',L)}if(S.me){const id='gsi_'+a.id+'_'+S.me.id;put(id,'gs_install',a.id,{app:a.id,uid:S.me.id,ts:Date.now()}).then(()=>{if(!S.counted)S.counted={};if(!S.counted[a.id]){S.counted[a.id]=1;S.inst[a.id]=(S.inst[a.id]||0)+1}}).catch(()=>{})}}
function install(a){if(!needLogin('#/app/'+a.id))return;const url=a.apk||a.apkUrl;if(url){recordInstall(a);const el=document.createElement('a');el.href=url;el.download=String(a.name||'app').replace(/[^\w.-]+/g,'_')+'.apk';el.rel='noopener';document.body.appendChild(el);el.click();el.remove();openSheet(`<h3>Download started</h3><div class="mu" style="margin-bottom:12px">To finish installing “${esc(a.name)}” on your phone:</div><div class="cardx" style="margin:0 0 14px"><b>1.</b> Open the downloaded file (in your notifications or Downloads).<br><b>2.</b> If your phone asks, allow <b>Install unknown apps</b> for this browser.<br><b>3.</b> Tap <b>Install</b>.<br><div class="mu" style="margin-top:8px;font-size:12px">Android may show a safety warning because this app is not from Google Play. Only install apps you trust.</div></div><button class="btn blk" data-act="closesheet">OK</button>`)}else if(a.web){recordInstall(a);window.open(a.web,'_blank','noopener')}else toast('This app has no file yet')}
function reviewSheet(id){if(!needLogin('#/app/'+id))return;const a=byId(id);let st=5;openSheet(`<h3>Rate ${esc(a.name)}</h3><div class="mu" style="margin-bottom:8px">Reviews are public</div><div id="rst" style="display:flex;gap:6px;justify-content:center;margin:10px 0 16px">${[1,2,3,4,5].map(i=>`<button data-st="${i}" style="color:var(--gr)"><svg width="40" height="40" viewBox="0 0 24 24"><path d="${IC.star}"/></svg></button>`).join('')}</div><textarea id="rtx" rows="4" maxlength="500" placeholder="Describe your experience (optional)"></textarea><button class="btn blk" id="rsv" style="margin-top:14px">Post</button><button class="btn out blk" style="margin-top:10px" data-act="closesheet">Cancel</button>`);
 const paint=()=>$$('#rst button').forEach(b=>b.style.opacity=(+b.dataset.st<=st)?1:.3);paint();$('#rst').onclick=e=>{const b=e.target.closest('[data-st]');if(b){st=+b.dataset.st;paint()}};
 $('#rsv').onclick=async()=>{const text=($('#rtx').value||'').trim(),rid='gsr_'+id+'_'+S.me.id;try{await put(rid,'gs_review',id,{app:id,uid:S.me.id,name:S.me.name,stars:st,text,ts:Date.now()});closeSheet();toast('Thanks for your review');await loadAll();loadRevs(id)}catch(e){toast('Could not post your review')}}}
const ACT={back:()=>{if(history.length>1)history.back();else go('#/')},closesheet:closeSheet,goto:id=>go(id),signin:doSignin,signup:doSignup,signout:signOut,
 install:id=>{const a=byId(id);if(a)install(a)},review:id=>reviewSheet(id),more:(id,el)=>{const d=$('#desc');if(!d)return;d.style.maxHeight='none';el.remove()},
 share:async id=>{const a=byId(id),u=location.href.split('#')[0]+'#/app/'+id;try{if(navigator.share)await navigator.share({title:a.name,text:a.short,url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}}catch(e){}},
 submitapp:submitApp,rmshot:id=>{F.shots.splice(+id,1);thumbs()},

 savecfg:async()=>{const fee=Math.max(1,+$('#c_fee').value||5),rate=Math.max(100,+$('#c_rate').value||1500);S.cfg={...S.cfg,fee,rate};try{await put('gscfg','gs_cfg','',S.cfg);toast('Saved')}catch(e){toast('Could not save')}},

(function pwa(){try{[['icon','image/jpeg'],['apple-touch-icon','']].forEach(([r])=>{const k=document.createElement('link');k.rel=r;k.href=GLOGO;document.head.appendChild(k)});const man={id:'./',name:'Galaxy Store',short_name:'Galaxy Store',description:'Discover and install apps. Powered by VELTEX.',start_url:new URL('./',location.href).href,scope:new URL('./',location.href).href,display:'standalone',background_color:'#ffffff',theme_color:'#ffffff',icons:[{src:GLOGO,sizes:'192x192',type:'image/jpeg'},{src:GLOGO,sizes:'512x512',type:'image/jpeg',purpose:'any'}]};const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));document.head.appendChild(l)}catch(e){}})();
(async function boot(){const t0=Date.now();const c=store.get('gs_cache',null);if(c){S.apps=c.apps||[];S.rate=c.rate||{};S.inst=c.inst||{};S.cfg={...S.cfg,...(c.cfg||{})}}
 await Promise.all([restore(),loadAll()]);const wait=Math.max(0,2300-(Date.now()-t0));setTimeout(()=>{const sp=$('#splash');sp.classList.add('out');setTimeout(()=>sp.remove(),600);if(!location.hash||location.hash==='#/'){if(!S.me&&!store.get('gs_seen',false)){store.set('gs_seen',true);location.hash='#/auth'}}render()},wait)})();
